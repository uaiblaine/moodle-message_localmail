# Mutation spec of message_localmail: each guard and the test that must redden without it.
# Run from the main session (fleet rule 6), on both database families:
#   mdl mutate moodle-message_localmail moodle-message_localmail/mutations/gates.conf --fast --db pgsql
#   mdl mutate moodle-message_localmail moodle-message_localmail/mutations/gates.conf --fast --db mariadb
#
# tag | file | perl script

# .gitattributes and LICENSE: the package carries a licence file.
R1_licence_left_out | .gitattributes | r1_licence_left_out.pl
