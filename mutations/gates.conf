#   -> test_only_english_strings_ship

R2_eu_shipped | .gitattributes | r2_eu_shipped.pl
#   -> test_only_english_strings_ship

R2_gl_shipped | .gitattributes | r2_gl_shipped.pl
#   -> test_only_english_strings_ship

R2_pt_br_shipped | .gitattributes | r2_pt_br_shipped.pl
